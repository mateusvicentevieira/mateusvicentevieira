name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mateusvicentevieira
          outputs: |
            dist/github-snake.svg?color_snake=%2300BFFF&color_dots=%23020817,%23033366,%23006699,%2300A3CC,%2300BFFF
            dist/github-snake-dark.svg?color_snake=%2300BFFF&color_dots=%23020817,%23033366,%23006699,%2300A3CC,%2300BFFF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
