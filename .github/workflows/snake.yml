name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mateusvicentevieira
          outputs: |
            dist/github-snake.svg?color_snake=%2300BFFF&color_dots=%23020817,%23033366,%23006699,%2300A3CC,%2300BFFF
            dist/github-snake-dark.svg?color_snake=%2300BFFF&color_dots=%23020817,%23033366,%23006699,%2300A3CC,%2300BFFF

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
