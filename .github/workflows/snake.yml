name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mateusvicentevieira
          outputs: |
            dist/github-snake.svg?color_snake=%2300BFFF&color_dots=%23020817,%23033366,%23006699,%2300A3CC,%2300BFFF
            dist/github-snake-dark.svg?color_snake=%2300BFFF&color_dots=%23020817,%23033366,%23006699,%2300A3CC,%2300BFFF

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
